name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pre-commit/action@v3.0.1
        env:
          # The local hook scans staged changes; the gitleaks job scans CI instead.
          SKIP: gitleaks

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
      - name: Run shellcheck
        run: shellcheck dot_config/bash/*.bash run_onchange_*.sh
      - name: Run shfmt
        run: shfmt -d .

  chezmoi-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: Run chezmoi apply (dry-run)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          TMP_HOME=$(mktemp -d)
          chezmoi apply --source="$GITHUB_WORKSPACE" --destination="$TMP_HOME" --dry-run --verbose
      - name: chezmoi doctor
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi doctor || true
